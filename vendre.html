<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vendre — SLA3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="site-header"></div>

  <main class="wrap narrow section" style="padding-top:2rem;">
    <div id="sell-form-view">
      <h1 class="page-title">Vends ta sla3</h1>
      <p class="page-sub">Quelques infos et tu es en ligne.</p>

      <form id="sell-form" style="margin-top:2rem;">
        <div class="field">
          <label>Photos (<span id="photo-count">0</span>/8)</label>
          <div class="photo-grid" id="photo-grid"></div>
          <p class="hint">La première photo sera la couverture de ton annonce.</p>
        </div>

        <div class="field">
          <label for="title">Titre</label>
          <input id="title" required type="text" placeholder="Ex. Caftan brodé main, fil doré" />
        </div>

        <div class="field">
          <label for="description">Description</label>
          <textarea id="description" required rows="4" placeholder="Matière, taille, défauts éventuels, raison de la vente..."></textarea>
        </div>

        <div class="field field-row">
          <div>
            <label for="categorie">Catégorie</label>
            <select id="categorie" required>
              <option value="" disabled selected>Choisir</option>
            </select>
          </div>
          <div>
            <label for="etat">État</label>
            <select id="etat" required>
              <option value="" disabled selected>Choisir</option>
            </select>
          </div>
        </div>

        <div class="field field-row">
          <div>
            <label for="ville">Ville</label>
            <select id="ville" required>
              <option value="" disabled selected>Choisir</option>
            </select>
          </div>
          <div>
            <label for="prix">Prix (DH)</label>
            <input id="prix" required type="number" min="1" placeholder="250" />
          </div>
        </div>

        <label class="checkbox-row">
          <input type="checkbox" checked />
          Accepter le paiement à la livraison
        </label>

        <button type="submit" class="btn btn-zellige btn-block" style="margin-top:1.75rem;">Publier l'annonce</button>
      </form>
    </div>

    <div id="sell-success-view" style="display:none; text-align:center; padding: 5rem 0;">
      <p style="font-size:2.5rem;">✓</p>
      <h1 class="page-title">Annonce publiée</h1>
      <p class="page-sub">Ta sla3 est maintenant visible par toute la communauté. (Ceci est une démo — rien n'a été envoyé à un serveur.)</p>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/patterns.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("categorie").insertAdjacentHTML(
        "beforeend",
        CATEGORIES.map((c) => `<option value="${c.slug}">${c.emoji} ${c.label}</option>`).join("")
      );
      document.getElementById("etat").insertAdjacentHTML(
        "beforeend",
        CONDITIONS.map((c) => `<option value="${c}">${c}</option>`).join("")
      );
      document.getElementById("ville").insertAdjacentHTML(
        "beforeend",
        CITIES.map((c) => `<option value="${c}">${c}</option>`).join("")
      );

      let photoCount = 0;
      const grid = document.getElementById("photo-grid");
      function renderPhotoGrid() {
        grid.innerHTML = Array.from({ length: 8 }).map((_, i) => `
          <button type="button" class="photo-slot ${i < photoCount ? "filled" : ""}" data-index="${i}">
            ${i < photoCount ? "✓" : "+"}
          </button>
        `).join("");
        document.getElementById("photo-count").textContent = photoCount;
      }
      grid.addEventListener("click", (e) => {
        const btn = e.target.closest(".photo-slot");
        if (!btn) return;
        const i = Number(btn.dataset.index);
        photoCount = i < photoCount ? photoCount : Math.min(8, i + 1);
        renderPhotoGrid();
      });
      renderPhotoGrid();

      document.getElementById("sell-form").addEventListener("submit", (e) => {
        e.preventDefault();
        document.getElementById("sell-form-view").style.display = "none";
        document.getElementById("sell-success-view").style.display = "block";
      });
    });
  </script>
</body>
</html>

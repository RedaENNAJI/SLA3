<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Annonce — SLA3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="site-header"></div>

  <main class="wrap section" style="padding-top:2rem;">
    <div id="product-root"></div>

    <section id="similar-section" style="margin-top:4rem; display:none;">
      <h2 class="section-title">Dans la même catégorie</h2>
      <div class="product-grid cols-4" id="similar-grid" style="margin-top:1.25rem;"></div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/patterns.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const { id } = getQueryParams();
      const product = getProductById(id || "1");
      const root = document.getElementById("product-root");

      if (!product) {
        root.innerHTML = `
          <div class="empty-state">
            <p>Cette annonce n'existe pas ou a été retirée.</p>
            <a href="parcourir.html" class="link-majorelle">Voir toutes les annonces</a>
          </div>
        `;
        return;
      }

      root.innerHTML = `
        <div class="product-detail">
          <div class="product-photo">${tilePatternSVG(product.patternSeed, product.palette)}</div>
          <div>
            <h1 class="detail-title">${product.title}</h1>
            <p class="detail-price">${product.price} DH</p>

            <dl class="detail-dl">
              <dt>État</dt><dd>${product.condition}</dd>
              ${product.size ? `<dt>Taille</dt><dd>${product.size}</dd>` : ""}
              <dt>Ville</dt><dd>${product.city}</dd>
              <dt>Vendeur</dt><dd>${product.seller} · ⭐ ${product.sellerRating}</dd>
            </dl>

            <p class="detail-desc">${product.description}</p>

            <div class="detail-actions">
              <button class="btn btn-majorelle">Acheter · ${product.price} DH</button>
              <button class="btn btn-outline">Envoyer un message</button>
              <button class="fav-btn" aria-label="Ajouter aux favoris">♥ ${product.favorites}</button>
            </div>

            <div class="protection-note">
              Protégé par SLA3 : ton paiement n'est versé au vendeur qu'après ta confirmation de réception.
            </div>
          </div>
        </div>
      `;

      const similar = PRODUCTS.filter((p) => p.category === product.category && p.id !== product.id).slice(0, 4);
      if (similar.length > 0) {
        document.getElementById("similar-section").style.display = "block";
        document.getElementById("similar-grid").innerHTML = similar.map(productCardHTML).join("");
      }

      document.title = `${product.title} — SLA3`;
    });
  </script>
</body>
</html>

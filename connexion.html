<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Se connecter — SLA3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="site-header"></div>

  <main class="wrap narrower" style="padding-top:4rem; padding-bottom:4rem;">
    <h1 class="page-title">Se connecter</h1>
    <p class="page-sub">Content de te revoir sur SLA3.</p>

    <form onsubmit="event.preventDefault(); alert('Démo — pas de backend connecté.');" style="margin-top:2rem;">
      <div class="field">
        <label for="identifiant">Téléphone ou e-mail</label>
        <input id="identifiant" type="text" required placeholder="06 12 34 56 78" />
      </div>
      <div class="field">
        <label for="password">Mot de passe</label>
        <input id="password" type="password" required placeholder="••••••••" />
      </div>
      <button type="submit" class="btn btn-majorelle btn-block" style="margin-top:0.75rem;">Se connecter</button>
    </form>

    <p class="form-note">Pas encore de compte ? <a href="inscription.html" class="link-majorelle">Inscris-toi</a></p>
  </main>

  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

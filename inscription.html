<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Créer un compte — SLA3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="site-header"></div>

  <main class="wrap narrower" style="padding-top:4rem; padding-bottom:4rem;">
    <h1 class="page-title">Créer un compte</h1>
    <p class="page-sub">Rejoins la communauté SLA3, c'est gratuit.</p>

    <form onsubmit="event.preventDefault(); alert('Démo — pas de backend connecté.');" style="margin-top:2rem;">
      <div class="field">
        <label for="pseudo">Pseudo</label>
        <input id="pseudo" type="text" required placeholder="Amina_F" />
      </div>
      <div class="field">
        <label for="tel">Téléphone</label>
        <input id="tel" type="tel" required placeholder="06 12 34 56 78" />
      </div>
      <div class="field">
        <label for="ville">Ville</label>
        <select id="ville" required>
          <option value="" disabled selected>Choisir</option>
        </select>
      </div>
      <div class="field">
        <label for="password">Mot de passe</label>
        <input id="password" type="password" required placeholder="••••••••" />
      </div>
      <button type="submit" class="btn btn-zellige btn-block" style="margin-top:0.75rem;">Créer mon compte</button>
    </form>

    <p class="form-note">Déjà inscrit ? <a href="connexion.html" class="link-majorelle">Connecte-toi</a></p>
  </main>

  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("ville").insertAdjacentHTML(
        "beforeend",
        CITIES.map((c) => `<option value="${c}">${c}</option>`).join("")
      );
    });
  </script>
</body>
</html>
